@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --surface:#111111; --ink:#F5F5F5; --muted:#9C9C9C; --line:#262626;
    --accent:#FFFFFF; --accent-ink:#000000; --soft:#1C1C1C; color-scheme:dark;
    --g-fill:rgba(255,255,255,.11);--g-fill2:rgba(255,255,255,.05);--g-hi:rgba(255,255,255,.38);--g-edge:rgba(255,255,255,.16);--g-low:rgba(0,0,0,.35);--g-shadow:rgba(0,0,0,.5);--g-b1:rgba(90,110,255,.30);--g-b2:rgba(255,80,170,.18);--g-b3:rgba(40,200,170,.18);
  }
}
:root[data-theme="dark"]{
  --bg:#000000; --surface:#111111; --ink:#F5F5F5; --muted:#9C9C9C; --line:#262626;
  --accent:#FFFFFF; --accent-ink:#000000; --soft:#1C1C1C; color-scheme:dark;
  --g-fill:rgba(255,255,255,.11);--g-fill2:rgba(255,255,255,.05);--g-hi:rgba(255,255,255,.38);--g-edge:rgba(255,255,255,.16);--g-low:rgba(0,0,0,.35);--g-shadow:rgba(0,0,0,.5);--g-b1:rgba(90,110,255,.30);--g-b2:rgba(255,80,170,.18);--g-b3:rgba(40,200,170,.18);
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45;overflow:hidden;margin:0;
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--font-head);margin:0;text-wrap:balance;letter-spacing:-.015em}
h1{font-size:28px;line-height:1.1}
h2{font-size:20px}
h3{font-size:16px}
p{margin:0}
ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
input[type=text],input[type=url],input[type=time],textarea{font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;width:100%;min-width:0}
textarea{resize:vertical;min-height:84px}
input:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible,label:focus-within{outline:2px solid var(--accent);outline-offset:2px}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.fill{fill:currentColor;stroke:none}
.muted{color:var(--muted)}
.small{font-size:13px}
.label{font-size:11.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.logo{display:block;height:var(--h,28px);aspect-ratio:0.4000;background:currentColor;-webkit-mask:var(--logo) center/contain no-repeat;mask:var(--logo) center/contain no-repeat;flex:none}

#app{height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;background:var(--bg);position:relative}
#main{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column}
.pad{padding:16px max(16px,env(safe-area-inset-left,0px)) 24px max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
nav{display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border-top:1px solid var(--line);
  padding:4px max(8px,env(safe-area-inset-right,0px)) 4px max(8px,env(safe-area-inset-left,0px))}
nav button{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 0 7px;color:var(--muted);font-size:11.5px;font-weight:500}
nav button[aria-current=page]{color:var(--ink);font-weight:600}
nav button[aria-current=page]::before{content:"";position:absolute;top:0;left:30%;right:30%;height:2px;background:var(--accent);border-radius:2px}
nav button[aria-current=page] svg{stroke-width:2.4}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--accent);color:var(--accent-ink);font-weight:600;border-radius:14px;padding:13px 18px;min-height:48px}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn.line{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn.danger{background:transparent;border:1.5px solid var(--ink);color:var(--ink)}
.btn.block{width:100%}
.btn.sm{min-height:40px;padding:8px 14px;font-size:14px;border-radius:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px}
.row{display:flex;align-items:center;gap:12px;min-width:0}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.stack{display:flex;flex-direction:column;gap:10px}
.between{justify-content:space-between}

.avatar{width:52px;height:52px;border-radius:50%;object-fit:cover;background:var(--soft);color:var(--ink);display:grid;place-items:center;font-family:var(--font-head);font-weight:700;font-size:20px;flex:none;border:1px solid var(--line)}
.avatar.xl{width:112px;height:112px;font-size:44px}
.avatar.sm{width:40px;height:40px;font-size:16px}

/* chave liga/desliga (Perfil > Aparência) */

/* Liquid Glass: opcional, ligado em Perfil > Aparência (html[data-glass=on]).
   Vidro translúcido com desfoque, brilho nas bordas e barra inferior flutuante, como no iOS 26.
   O desfoque só vai em poucos elementos grandes para não pesar no Android. */
:root[data-glass="on"] #app{background:
  radial-gradient(90% 38% at 8% 0%,var(--g-b1),transparent 70%),
  radial-gradient(80% 34% at 100% 40%,var(--g-b2),transparent 70%),
  radial-gradient(90% 38% at 0% 100%,var(--g-b3),transparent 70%),var(--bg)}
:root[data-glass="on"] .card,:root[data-glass="on"] .entry,:root[data-glass="on"] .item,:root[data-glass="on"] .stat,
:root[data-glass="on"] .day,:root[data-glass="on"] .mini,:root[data-glass="on"] .ring,:root[data-glass="on"] .addtile{
  background:linear-gradient(180deg,var(--g-fill),var(--g-fill2));border-color:transparent;
  box-shadow:inset 0 1px 0 var(--g-hi),inset 0 0 0 1px var(--g-edge),inset 0 -1px 0 var(--g-low)}
:root[data-glass="on"] .day.empty{background:transparent;box-shadow:none}
:root[data-glass="on"] .day.today,:root[data-glass="on"] .mini.cur{background:var(--accent);box-shadow:0 4px 16px var(--g-shadow),inset 0 1px 0 var(--g-hi)}
:root[data-glass="on"] .iconbtn,:root[data-glass="on"] .chip,:root[data-glass="on"] .btn.ghost,:root[data-glass="on"] .btn.line,:root[data-glass="on"] .seg{
  background:linear-gradient(180deg,var(--g-fill),var(--g-fill2));border-color:transparent;
  -webkit-backdrop-filter:blur(14px) saturate(170%);backdrop-filter:blur(14px) saturate(170%);
  box-shadow:inset 0 1px 0 var(--g-hi),inset 0 0 0 1px var(--g-edge),inset 0 -1px 0 var(--g-low),0 4px 14px var(--g-shadow)}
:root[data-glass="on"] .btn:not(.ghost):not(.line):not(.danger),:root[data-glass="on"] .tile{
  background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 86%,#fff),color-mix(in srgb,var(--accent) 80%,transparent));
  -webkit-backdrop-filter:blur(14px) saturate(170%);backdrop-filter:blur(14px) saturate(170%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35),inset 0 -1px 0 rgba(0,0,0,.2),0 8px 20px var(--g-shadow)}
:root[data-glass="on"] .btn.danger{background:linear-gradient(180deg,var(--g-fill),var(--g-fill2));border-color:transparent;
  box-shadow:inset 0 1px 0 var(--g-hi),inset 0 0 0 1.5px var(--ink)}
:root[data-glass="on"] .seg button[aria-pressed=true]{box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 3px 10px var(--g-shadow)}
:root[data-glass="on"] .btn:active,:root[data-glass="on"] .iconbtn:active,:root[data-glass="on"] .chip:active{transform:scale(.96);transition:transform .12s}
:root[data-glass="on"] nav{margin:0 max(14px,env(safe-area-inset-left,0px)) calc(8px + var(--sab,0px));padding-bottom:4px;border:0;border-radius:30px;
  background:linear-gradient(180deg,var(--g-fill),var(--g-fill2));
  -webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);
  box-shadow:inset 0 1px 0 var(--g-hi),inset 0 0 0 1px var(--g-edge),inset 0 -1px 0 var(--g-low),0 10px 30px var(--g-shadow)}
:root[data-glass="on"] nav button[aria-current=page]{border-radius:22px;background:var(--g-fill);box-shadow:inset 0 1px 0 var(--g-hi),inset 0 0 0 1px var(--g-edge)}
:root[data-glass="on"] nav button[aria-current=page]::before{display:none}
:root[data-glass="on"] .sheet{background:linear-gradient(180deg,var(--g-fill),var(--g-fill2)),color-mix(in srgb,var(--bg) 55%,transparent);border-top:0;
  -webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);
  box-shadow:inset 0 1px 0 var(--g-hi),inset 0 0 0 1px var(--g-edge)}
:root[data-glass="on"] .toast{background:linear-gradient(180deg,var(--g-fill),var(--g-fill2)),color-mix(in srgb,var(--bg) 60%,transparent);color:var(--ink);border:0;
  -webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);
  box-shadow:inset 0 1px 0 var(--g-hi),inset 0 0 0 1px var(--g-edge),0 10px 30px var(--g-shadow)}
:root[data-glass="on"] .cta{bottom:0}
@supports not ((-webkit-backdrop-filter:blur(1px)) or (backdrop-filter:blur(1px))){
  :root[data-glass="on"] nav,:root[data-glass="on"] .sheet,:root[data-glass="on"] .toast{background:var(--surface)}
}

/* chat */

/* ---- áreas seguras, desempenho, saúde, vídeo, áudio, notas e gráficos ---- */
[hidden]{display:none!important}
html,body{-webkit-tap-highlight-color:transparent}
button,a,label,input,textarea{touch-action:manipulation}
#main,.msgs,.memo-list,.sheet{overscroll-behavior:contain}
:root{--sat:max(env(safe-area-inset-top,0px),var(--safe-area-inset-top,0px));--sab:max(env(safe-area-inset-bottom,0px),var(--safe-area-inset-bottom,0px))}

/* ---- animação de clique em todos os botões ---- */
button,.day,.mini,.tile,.entry,.chip,.iconbtn,.btn,[data-act]{-webkit-tap-highlight-color:transparent}
button,[data-act],.day,.mini{transition:transform .16s cubic-bezier(.34,1.56,.64,1),filter .16s,background-color .2s,opacity .2s}
button:active,[data-act]:active,.day:not(.empty):active,.mini:active{transform:scale(.93);filter:brightness(.92)}
.tile:active,.entry:active,.card[data-act]:active{transform:scale(.97)}
nav button:active{transform:scale(.86)}
nav button:active svg{transform:translateY(-3px) scale(1.18)}
nav button svg{transition:transform .2s cubic-bezier(.34,1.56,.64,1)}
.btn,.tile,.iconbtn,.chip,nav button,.day,.mini,button.entry{position:relative;overflow:hidden}
.rip{position:absolute;border-radius:50%;pointer-events:none;background:currentColor;opacity:.22;transform:scale(0);animation:rip .55s ease-out forwards}
@keyframes daywiggle{0%,100%{transform:none}18%{transform:translateX(-3px) rotate(-3deg)}36%{transform:translateX(3px) rotate(3deg)}54%{transform:translateX(-2px) rotate(-2deg)}72%{transform:translateX(2px) rotate(1.5deg)}88%{transform:translateX(-1px)}}

@keyframes rip{to{transform:scale(1);opacity:0}}
/* liquid glass: Adestrar (.tile) e Saúde (.tile.alt) sem desfoque duplo e com cor certa */

  box-shadow:inset 0 1px 0 var(--g-hi),inset 0 0 0 1px var(--g-edge),inset 0 -1px 0 var(--g-low),0 6px 16px var(--g-shadow)}

:root[data-glass="on"] button:active,:root[data-glass="on"] .tile:active{transform:scale(.95)}

/* ---- indicador deslizante da barra inferior + transições de tela ---- */

.nav-ind{position:absolute;top:4px;bottom:4px;left:0;z-index:0;pointer-events:none;transition:transform .5s cubic-bezier(.3,1.3,.5,1)}
.nav-ind::after{content:"";position:absolute;top:-4px;left:30%;right:30%;height:2.5px;border-radius:3px;background:var(--accent)}

:root[data-glass="on"] .nav-ind::after{top:0;left:6px;right:6px;height:auto;bottom:0;border-radius:22px;background:var(--g-fill);
  box-shadow:inset 0 1px 0 var(--g-hi),inset 0 0 0 1px var(--g-edge),0 4px 14px var(--g-shadow)}
:root[data-glass="on"] nav button[aria-current=page]{background:none;box-shadow:none}

@keyframes navpop{0%{transform:scale(.7) translateY(2px)}60%{transform:scale(1.2) translateY(-3px)}100%{transform:none}}
.pg-in{animation:pgfade .3s ease-out}

.pg-in .pad>*:nth-child(5){animation-delay:.16s}.pg-in .pad>*:nth-child(6){animation-delay:.2s}.pg-in .pad>*:nth-child(n+7){animation-delay:.24s}
@keyframes pgitem{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:none}}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.ring svg{width:68px;height:68px;margin-bottom:4px}
.ring b{font-family:var(--font-head);font-size:14px;font-variant-numeric:tabular-nums}
.ring span{font-size:11.5px;color:var(--muted)}
.quick{display:flex;gap:8px;flex-wrap:wrap}
.chart{width:100%;height:auto;display:block}
.chart text{font-size:10px;fill:var(--muted)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px}
.hbar{display:grid;grid-template-columns:84px 1fr auto;gap:8px;align-items:center;font-size:13px}
.hbar>span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar>div{height:8px;border-radius:4px;background:var(--soft);overflow:hidden}
.hbar>div>i{display:block;height:100%;border-radius:4px;background:var(--accent)}
.hbar b{font-variant-numeric:tabular-nums}
.hrow{display:flex;gap:10px}
.hrow>label{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
input[type=time],input[type=date],input[type=number]{font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;width:100%;min-width:0}
.vcard{position:relative;width:100%;aspect-ratio:16/9;border-radius:16px;overflow:hidden;background:#161616 center/cover no-repeat;color:#fff}
.vcard .pl{position:absolute;inset:0;display:grid;place-items:center;width:100%}
.vcard .pl i{width:54px;height:54px;border-radius:50%;background:rgba(0,0,0,.55);display:grid;place-items:center}
.vcard .du{position:absolute;left:10px;bottom:8px;font-size:12px;background:rgba(0,0,0,.55);padding:2px 8px;border-radius:999px;font-variant-numeric:tabular-nums}
.vcard .rm{position:absolute;right:8px;top:8px;width:34px;height:34px;border-radius:50%;background:rgba(0,0,0,.55);display:grid;place-items:center;color:#fff}
.vplayer{position:fixed;inset:0;z-index:60;background:#000;display:flex;flex-direction:column;padding-top:var(--sat)}
.vplayer video{flex:1;min-height:0;width:100%;background:#000}
.vplayer .x{position:absolute;top:calc(var(--sat) + 10px);left:12px;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.2);color:#fff;display:grid;place-items:center;z-index:2}
.aud{display:flex;align-items:center;gap:10px;min-width:200px}
.aud .pp{width:38px;height:38px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.bub.me .aud .pp{background:var(--accent-ink);color:var(--accent)}
.aud .abar{position:relative;flex:1;height:22px;display:flex;align-items:center}
.aud .abar::before{content:"";position:absolute;left:0;right:0;height:4px;border-radius:2px;background:currentColor;opacity:.25}
.aud .abar i{position:relative;display:block;height:4px;border-radius:2px;background:currentColor;width:0}
.aud .ats{font-size:11px;font-variant-numeric:tabular-nums;opacity:.7;min-width:30px;text-align:right}
.recbar{flex:1;display:flex;align-items:center;gap:10px;min-width:0}
.recdot{width:10px;height:10px;border-radius:50%;background:#e5484d;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.25}}
.memo-title{font-family:var(--font-head);font-size:22px;font-weight:600;letter-spacing:-.01em}
.memo-meta{font-size:12px}

/* Mibo ao vivo */
.live{position:fixed;inset:0;z-index:60;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:max(28px,env(safe-area-inset-top)) 24px max(28px,env(safe-area-inset-bottom))}
.live-mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;width:100%;max-width:420px;text-align:center}
.live .orb{display:block;width:176px;height:176px;transition:opacity .3s}
.live .orb.conectando{opacity:.55}
.live-sheet{display:contents}
.live-st{font-size:18px;font-weight:600}
/* janela flutuante da Mibo (Hey Mibo): folha embaixo, o resto transparente */
html.ov,body.ov{background:transparent!important}
body.ov #app,body.ov #toasts{display:none!important}
body.ov .live{background:rgba(0,0,0,.28);justify-content:flex-end;padding:0}
body.ov .live-sheet{display:flex;flex-direction:column;align-items:center;gap:8px;width:100%;box-sizing:border-box;background:var(--bg);color:var(--ink);border-radius:28px 28px 0 0;padding:16px 20px max(20px,env(safe-area-inset-bottom));box-shadow:0 -10px 40px rgba(0,0,0,.35);animation:ovup .22s ease-out}
body.ov .live-mid{flex:none;gap:6px}
body.ov .live .orb{width:128px;height:128px}
@keyframes ovup{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.live-tx{font-size:14px;max-width:100%;overflow-wrap:anywhere;min-height:20px}
.live-bot{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}

/* Versões: APP_VERSION muda a cada atualização do app. DATA_VERSION só muda quando o formato dos dados muda; nesse caso, acrescente um passo em migrate(). Nunca troque KEY, ou os dados salvos somem. */

function migrate(o){
  var from=(o&&o.v)||0;
  o=Object.assign(def(),o||{});
  ['logs','reminders','contacts','custom','areas','memos','lists','habits','fin'].forEach(function(k){if(!Array.isArray(o[k]))o[k]=[]});
  ['vids','chats','notified','notes'].forEach(function(k){if(!o[k]||typeof o[k]!=='object'||Array.isArray(o[k]))o[k]={}});
  o.reminders.forEach(function(r){if(r.time==null)r.time='';if(!r.kind)r.kind='lembrete';if(r.tag==null)r.tag=''});
  o.lists.forEach(function(l){if(!Array.isArray(l.items))l.items=[]});
  o.habits.forEach(function(h){if(!h.days||typeof h.days!=='object'||Array.isArray(h.days))h.days={}});
  Object.keys(o.vids).forEach(function(k){var v=o.vids[k];if(typeof v==='string')o.vids[k]=v?[v]:[];else if(!Array.isArray(v))o.vids[k]=[]});

  if(!o.firstRun)o.firstRun=Date.now();
  o.memos=o.memos.filter(function(m){return m&&typeof m.text==='string'});

  o.memos.forEach(function(m){if(typeof m.title!=='string')m.title=''});

var REM_RE=/\[\[LEMBRETE\|([^|\]]*)\|([^|\]]*)\|([^|\]]*?)(?:\|([^|\]]*))?\]\]/gi;
function miboRemInstr(){

function addRemFromMibo(date,time,title,yearly){
  date=String(date||'').trim();time=String(time||'').trim();title=String(title||'').replace(/\s+/g,' ').trim().slice(0,140);
  var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(date);
  if(!m||!title)return {ok:false,msg:'Não consegui entender a data ou o título do lembrete.'};
  var d=new Date(+m[1],+m[2]-1,+m[3]);
  if(d.getFullYear()!==+m[1]||d.getMonth()!==+m[2]-1||d.getDate()!==+m[3])return {ok:false,msg:'A data do lembrete é inválida.'};
  if(time&&!/^([01]?\d|2[0-3]):[0-5]\d$/.test(time))time='';
  if(time&&time.length===4)time='0'+time;
  if(date<todayStr())return {ok:false,msg:'Esse lembrete ficaria em uma data que já passou.'};
  var dup=S.reminders.some(function(r){return r.date===date&&(r.time||'')===time&&r.title===title});
  if(!dup)S.reminders.push({id:uid(),date:date,title:title,yearly:!!yearly,time:time,kind:yearly?'aniversario':'lembrete',tag:''});
  var late=false;
  if(date===todayStr()){var tm=(time||'09:00').split(':');late=new Date(+m[1],+m[2]-1,+m[3],+tm[0],+tm[1]).getTime()<=Date.now()}
  save();pushWidget(true);ensureNotif();scheduleAll();
  if(ui.tab==='cal'||ui.tab==='home')render();
  var when=shortDate(date)+' ('+parse(date).toLocaleDateString('pt-BR',{weekday:'short'}).replace('.','')+')'+(time?' às '+time:' (aviso às 09:00)');
  return {ok:true,dup:dup,late:late,msg:(dup?'Esse lembrete já existia: ':'Lembrete criado: ')+title+', '+when+(yearly?', todo ano':'')+'.'+(late?' Atenção: o horário de hoje já passou, então não vai tocar.':'')};
}
/* tira as marcações do texto da Mibo, cria os lembretes e devolve o texto final */
function applyMiboReminders(text){
  try{return applyMiboReminders2(text)}catch(e){return String(text).replace(REM_RE,'').trim()}

function applyMiboReminders2(text){
  var res=[];

function buildIdx(){
  var L={},R={},Y={},B={};
  S.logs.forEach(function(l){(L[l.date]=L[l.date]||[]).push(l)});

  S.reminders.forEach(function(r){var m=r.yearly?Y:R,k=r.yearly?r.date.slice(5):r.date;(m[k]=m[k]||[]).push(r)});
  return {L:L,R:R,Y:Y,B:B};
}
function dayInfo(d){

/* feriados do Brasil, calculados para qualquer ano (não precisa de internet).
   f = feriado nacional, p = ponto facultativo, c = data comemorativa */
var HOL_CACHE={};
function easterOf(y){
  var a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),
      h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),
      mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1;
  return new Date(y,mo-1,da);
}
function nthWeekday(y,m,wd,n){var first=new Date(y,m,1).getDay();return 1+((wd-first+7)%7)+(n-1)*7}
function lastWeekday(y,m,wd){var last=new Date(y,m+1,0),back=(last.getDay()-wd+7)%7;return last.getDate()-back}
function holidaysOf(y){
  if(HOL_CACHE[y])return HOL_CACHE[y];
  var M={};
  function add(m,d,n,k){var s=ymd(y,m,d);(M[s]=M[s]||[]).push({n:n,k:k})}
  var E=easterOf(y);

function widgetPayload(){
  var t=todayStr(),days={};

    var d=addDays(t,i),lines=[];
    S.reminders.filter(function(r){return matches(r,d)}).sort(function(a,b){return (a.time||'').localeCompare(b.time||'')}).forEach(function(r){lines.push((isBday(r)?'🎂 ':'')+(r.time?r.time+' ':'')+String(r.title).replace(/\s+/g,' '))});

    days[d]=lines.slice(0,4);
  }
  var n=openTasks();
  var g=S.health.goals,sl=sleepOn(t)||sleepOn(addDays(t,-1)),marks={};

/* foto */
function readPhoto(file,cb){
  var fr=new FileReader();
  fr.onload=function(){
    var img=new Image();
    img.onload=function(){
      var s=Math.min(img.width,img.height),c=document.createElement('canvas');c.width=c.height=256;
      c.getContext('2d').drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,256,256);
      cb(c.toDataURL('image/jpeg',0.8));
    };
    img.onerror=function(){toast('Não consegui abrir essa imagem.')};
    img.src=fr.result;
  };
  fr.readAsDataURL(file);
}

var GREEN='#34c77b',RED='#ff6b6b';
function finMonth(ym){var g=0,s=0,a=0;S.fin.forEach(function(f){if(f.date.slice(0,7)!==ym)return;if(f.kind==='ganho')g+=f.cents;else if(f.kind==='gasto'||f.paid)s+=f.cents;else a+=f.cents});return{g:g,s:s,a:a}}
function lineSVG(vals){
  var W=300,Hh=100,p=6,n=vals.length,mn=Math.min(0,Math.min.apply(null,vals)),mx=Math.max(0,Math.max.apply(null,vals)),rg=(mx-mn)||1,last=vals[n-1],col=last>=0?GREEN:RED;
  var X=function(i){return p+(n>1?i*(W-2*p)/(n-1):(W-2*p)/2)},Y=function(v){return p+(1-(v-mn)/rg)*(Hh-2*p)};
  var pts=vals.map(function(v,i){return X(i).toFixed(1)+','+Y(v).toFixed(1)}).join(' '),z=Y(0).toFixed(1);
  return '<svg class="chart" viewBox="0 0 '+W+' '+Hh+'" role="img" aria-label="Saldo acumulado no mês"><line x1="0" x2="'+W+'" y1="'+z+'" y2="'+z+'" stroke="var(--line)" stroke-width="1.5"/><polygon points="'+X(0).toFixed(1)+','+z+' '+pts+' '+X(n-1).toFixed(1)+','+z+'" fill="'+col+'" opacity=".15"/><polyline points="'+pts+'" fill="none" stroke="'+col+'" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/></svg>';
}
function finCharts(ym){
  var pr=ym.split('-'),y=+pr[0],m=+pr[1]-1,keys=[],i;
  for(i=5;i>=0;i--){var dt=new Date(y,m-i,1);keys.push(dt.getFullYear()+'-'+pad(dt.getMonth()+1))}
  var data=keys.map(finMonth);
  if(!data.some(function(x){return x.g||x.s}))return '';
  var cur=finMonth(ym),mx=1,W=300,Hh=120,cy=Hh-18,bw=(W-12)/6,s='';
  data.forEach(function(x){mx=Math.max(mx,x.g,x.s)});
  data.forEach(function(x,i){
    var x0=6+i*bw+bw*.15,w=bw*.3,hg=Math.round(x.g/mx*(cy-8)),hs=Math.round(x.s/mx*(cy-8));
    s+='<rect x="'+x0.toFixed(1)+'" y="'+(cy-hg)+'" width="'+w.toFixed(1)+'" height="'+hg+'" rx="3" fill="'+GREEN+'"/><rect x="'+(x0+w+2).toFixed(1)+'" y="'+(cy-hs)+'" width="'+w.toFixed(1)+'" height="'+hs+'" rx="3" fill="'+RED+'"/><text x="'+(6+i*bw+bw/2).toFixed(1)+'" y="'+(Hh-4)+'" text-anchor="middle">'+MONTHS[+keys[i].slice(5)-1].slice(0,3)+'</text>';
  });
  var nd=new Date(y,m+1,0).getDate(),now=new Date(),isCur=now.getFullYear()===y&&now.getMonth()===m,upto=isCur?now.getDate():nd,daily=[];
  for(i=0;i<=nd;i++)daily.push(0);
  S.fin.forEach(function(f){if(f.date.slice(0,7)!==ym)return;var dd=+f.date.slice(8);if(f.kind==='ganho')daily[dd]+=f.cents;else if(f.kind==='gasto'||f.paid)daily[dd]-=f.cents});
  var run=0,vals=[];for(i=1;i<=upto;i++){run+=daily[i];vals.push(run)}
  var grp={};S.fin.forEach(function(f){if(f.date.slice(0,7)!==ym||!(f.kind==='gasto'||(f.kind==='conta'&&f.paid)))return;var k=norm(f.desc);(grp[k]=grp[k]||{n:f.desc,c:0}).c+=f.cents});
  var top=Object.keys(grp).map(function(k){return grp[k]}).sort(function(a,b){return b.c-a.c}).slice(0,5);
  var saldo=cur.g-cur.s,notes=[];
  if(cur.g>0)notes.push(saldo>=0?'Você guardou '+Math.round(saldo/cur.g*100)+'% do que ganhou neste mês.':'Você gastou '+Math.round(-saldo/cur.g*100)+'% a mais do que ganhou neste mês.');
  if(cur.s>0&&upto>0){notes.push('Gasto médio de '+brl(Math.round(cur.s/upto))+' por dia.');if(isCur&&upto<nd)notes.push('No ritmo atual, o mês fecha com cerca de '+brl(Math.round(cur.s/upto*nd))+' em gastos.')}
  return '<div class="card stack"><div class="label">Rendimento do mês</div>'+(notes.length?notes.map(function(t){return '<p class="small">'+esc(t)+'</p>'}).join(''):'<p class="small muted">Lance ganhos e gastos para ver o rendimento.</p>')+'</div>'+
   '<div class="card stack"><div class="label">Ganhos x gastos · 6 meses</div><svg class="chart" viewBox="0 0 '+W+' '+Hh+'" role="img" aria-label="Ganhos e gastos dos últimos 6 meses">'+s+'</svg><div class="legend"><span><i style="background:'+GREEN+'"></i>ganhos</span><span><i style="background:'+RED+'"></i>gastos</span></div></div>'+
   (vals.length&&(cur.g||cur.s)?'<div class="card stack"><div class="label">Saldo acumulado no mês</div>'+lineSVG(vals)+'</div>':'')+
   (top.length?'<div class="card stack"><div class="label">Para onde foi o dinheiro</div>'+top.map(function(t){return '<div class="hbar"><span>'+esc(t.n)+'</span><div><i style="width:'+Math.max(3,Math.round(t.c/(cur.s||1)*100))+'%"></i></div><b>'+esc(brl(t.c))+'</b></div>'}).join('')+'</div>':'');
}

function moreActs(k,arg,el,e){
  if(k==='rec-start'){recStart();return true}
  if(k==='rec-send'){recSend();return true}
  if(k==='rec-cancel'){recCancel();return true}
  if(k==='aud'){audToggle(arg);return true}
  if(k==='aud-seek'){
    if(AU.id===arg&&AU.a){var rc=el.getBoundingClientRect(),d=+(el.closest('.aud').getAttribute('data-d'))||0;if(d&&rc.width){try{AU.a.currentTime=Math.max(0,Math.min(d,(e.clientX-rc.left)/rc.width*d))}catch(x){}audSync()}}else audToggle(arg);
    return true;
  }
  if(k==='vplay'){var vp=arg.split(':');vplay(vp[0],+vp[1]);return true}
  if(k==='vclose'){vstop();return true}
  if(k==='h-day'){var nd=addDays(hDay(),+arg);if(nd>todayStr())return true;ui.hd=nd;render();return true}
  if(k==='h-water'){var dd=hDay(),v=Math.max(0,waterOn(dd)+(+arg));if(v)S.health.water[dd]=v;else delete S.health.water[dd];save();scheduleAll();render();return true}
  if(k==='h-meal-type'){readMeal();ui.meal.type=arg;render();return true}
  if(k==='h-meal-add'){
    readMeal();var ds=(ui.meal.desc||'').trim();if(!ds){toast('Escreva o que você comeu.');return true}
    var kc=Math.round(parseFloat(String(ui.meal.kcal).replace(',','.')));
    S.health.meals.push({id:uid(),date:hDay(),type:ui.meal.type,desc:ds,kcal:kc>0?kc:0,t:Date.now()});
    ui.meal.desc='';ui.meal.kcal='';save();scheduleAll();toast('Refeição salva.');render();return true;
  }
  if(k==='h-meal-del'){S.health.meals=S.health.meals.filter(function(m){return m.id!==arg});save();scheduleAll();render();return true}
  if(k==='h-sl-q'){readSl();ui.sl.q=+arg;render();return true}
  if(k==='h-sl-save'){
    readSl();var mn=slMin(ui.sl.bed,ui.sl.wake),d2=hDay();
    if(mn<60||mn>1080){toast('Confira os horários: o sono deve ter entre 1h e 18h.');return true}
    S.health.sleep=S.health.sleep.filter(function(s){return s.date!==d2});
    S.health.sleep.push({id:uid(),date:d2,bed:ui.sl.bed,wake:ui.sl.wake,min:mn,q:ui.sl.q||3});
    S.health.sleep.sort(function(a,b){return a.date.localeCompare(b.date)});save();scheduleAll();toast('Sono salvo.');render();return true;
  }
  if(k==='h-sl-del'){var d3=hDay();S.health.sleep=S.health.sleep.filter(function(s){return s.date!==d3});ui.slDay=null;save();render();return true}
  if(k==='h-goals'){ui.hgoals=!ui.hgoals;render();return true}
  if(k==='h-goals-save'){
    var gw=parseInt($('#g-water').value,10),gk=parseInt($('#g-kcal').value,10),gs=parseFloat(String($('#g-sleep').value).replace(',','.'));
    if(!(gw>=500&&gw<=10000)||!(gk>=500&&gk<=10000)||!(gs>=3&&gs<=14)){toast('Confira os valores: água 500 a 10000 ml, calorias 500 a 10000, sono 3 a 14 horas.');return true}
    S.health.goals={water:gw,kcal:gk,sleep:gs};ui.hgoals=false;save();toast('Metas salvas.');render();return true;
  }
  if(k==='h-mibo-run'){miboHealth(true);return true}
  if(k==='h-mibo-on'){S.health.mibo.on=!(S.health.mibo.on!==false);save();scheduleAll();if(S.health.mibo.on)ensureNotif();render();return true}
  if(k==='h-ask'){ui.tab='chat';ui.chatView='chat';ui.chat='mibo';ui.drawer=false;render();sendText('Analise minha saúde dos últimos 7 dias (água, alimentação e sono) e diga o que posso melhorar.');return true}
  return false;
}

var schedBusy=false,schedAgain=false;
async function scheduleAll(){
  if(!LN||!S.user)return;
  if(schedBusy){schedAgain=true;return}
  schedBusy=true;
  try{
    var perm=await LN.checkPermissions();
    if(perm.display!=='granted')return;
    var pend=await LN.getPending();
    if(pend.notifications&&pend.notifications.length)await LN.cancel({notifications:pend.notifications.map(function(n){return{id:n.id}})});
    var list=[],nowMs=Date.now();
    S.reminders.forEach(function(r){
      var p=r.date.split('-').map(Number),tm=(r.time||'09:00').split(':').map(Number);
      var base={id:nid(r.id),title:isBday(r)?'🎂 Atelas Client':'Atelas Client',body:r.title,channelId:'lembretes'};
      if(r.yearly)list.push(Object.assign(base,{schedule:{on:{month:p[1],day:p[2],hour:tm[0],minute:tm[1]},allowWhileIdle:true}}));
      else{var at=new Date(p[0],p[1]-1,p[2],tm[0],tm[1]);if(at.getTime()>nowMs)list.push(Object.assign(base,{schedule:{at:at,allowWhileIdle:true}}))}
    });
    S.fin.forEach(function(f){
      if(f.kind!=='conta'||f.paid)return;
      var p=f.date.split('-').map(Number),at=new Date(p[0],p[1]-1,p[2],9,0);
      if(at.getTime()>nowMs)list.push({id:nid('b'+f.id),title:'Atelas Client',body:'Conta a pagar hoje: '+f.desc,channelId:'lembretes',schedule:{at:at,allowWhileIdle:true}});
    });
    list=list.concat(miboNudges(nowMs));
    if(list.length)await LN.schedule({notifications:list});
  }catch(e){}
  schedBusy=false;if(schedAgain){schedAgain=false;scheduleAll()}
}
function miboNudges(nowMs){
  var m=S.health&&S.health.mibo;if(!m||!m.on)return [];
  var out=[],T=todayStr(),g=S.health.goals;
  var plan=[
    {k:'agua1',h:10,mi:30,t:'Hora de beber água. Um copo agora já ajuda a bater a meta de hoje.',w:1},
    {k:'almoco',h:13,mi:30,t:'Já almoçou? Registre a refeição para eu acompanhar sua alimentação.',meal:'almoco'},
    {k:'agua2',h:15,mi:30,t:'Como está a água hoje? Beba um copo e registre no app.',w:1},
    {k:'agua3',h:18,mi:30,t:'Falta pouco do dia. Confira se a água de hoje está perto da meta.',w:1},
    {k:'jantar',h:20,mi:30,t:'Registre sua janta para fechar o dia de alimentação.',meal:'jantar'},
    {k:'sono',h:22,mi:30,t:'Hora de desacelerar. Dormir ~'+g.sleep+'h faz diferença amanhã.'},
    {k:'sonoreg',h:8,mi:0,t:'Bom dia! Registre como foi seu sono de ontem para eu acompanhar.',sl:1}
  ];
  for(var d=0;d<7;d++){
    var ds=addDays(T,d),p=ds.split('-').map(Number);
    plan.forEach(function(x){
      var at=new Date(p[0],p[1]-1,p[2],x.h,x.mi);if(at.getTime()<=nowMs)return;
      if(d===0){
        if(x.w&&waterOn(T)>=g.water*.8)return;
        if(x.meal&&S.health.meals.some(function(e){return e.date===T&&e.type===x.meal}))return;
        if(x.sl&&sleepOn(T))return;
      }
      out.push({id:nid('mibo:'+ds+':'+x.k),title:'Mibo',body:x.t,channelId:'mibo',schedule:{at:at,allowWhileIdle:true}});
    });
  }
  return out;
}

async function ensureNotif(){
  if(!NATIVE||!LN||!S.user)return;
  try{
    var r=await LN.checkPermissions();
    if(r.display!=='granted'&&r.display!=='denied')r=await LN.requestPermissions();
    permState=r.display;
    if(r.display==='granted'){
      try{var ex=await LN.checkExactNotificationSetting();if(ex&&ex.exact_alarm==='prompt'&&!S.askedExact){S.askedExact=1;save();await LN.changeExactNotificationSetting()}}catch(e){}
      scheduleAll();
    }
  }catch(e){}
}
async function nativeNotifPerm(){

}

document.addEventListener('change',function(e){
